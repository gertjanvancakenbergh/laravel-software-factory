name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  gate:
    name: Deterministic Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Copy environment
        run: cp .env.example .env && php artisan key:generate

      - name: Run Pest
        run: vendor/bin/pest --parallel

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G

      # Frontend checks (when package.json exists and scripts are present)
      - name: Setup Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        if: hashFiles('package.json') != ''
        run: npm ci || npm install

      - name: Typecheck
        if: hashFiles('package.json') != ''
        run: |
          if jq -e '.scripts.typecheck' package.json >/dev/null; then
            npm run typecheck
          else
            echo "No typecheck script"
          fi

      - name: Lint
        if: hashFiles('package.json') != ''
        run: |
          if jq -e '.scripts.lint' package.json >/dev/null; then
            npm run lint
          else
            echo "No lint script"
          fi
